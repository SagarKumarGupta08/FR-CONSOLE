<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login / Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f2f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-box h3 {
      font-weight: bold;
    }
    .toggle-link {
      cursor: pointer;
      color: blue;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h3 class="text-center text-primary mb-4" id="form-title">🔐 Admin Login</h3>
    
    <!-- Login Form -->
    <form id="login-form">
      <div class="mb-3">
        <input id="login-username" type="text" class="form-control" placeholder="Username" required>
      </div>
      <div class="mb-3">
        <input id="login-password" type="password" class="form-control" placeholder="Password" required>
      </div>
      <div id="login-error" class="alert alert-danger d-none"></div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
      <p class="text-center mt-3">First time? <span class="toggle-link" onclick="showRegister()">Create Admin</span></p>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="d-none">
      <div class="mb-3">
        <input id="register-username" type="text" class="form-control" placeholder="Username" required>
      </div>
      <div class="mb-3">
        <input id="register-password" type="password" class="form-control" placeholder="Password" required>
      </div>
      <div id="register-error" class="alert alert-danger d-none"></div>
      <button type="submit" class="btn btn-success w-100">Register</button>
      <p class="text-center mt-3">Already registered? <span class="toggle-link" onclick="showLogin()">Login</span></p>
    </form>
  </div>

  <script>
    // JSONBin config
    const JSONBIN_API_KEY = "$2a$10$VIzmNWXxdrqD5iAxo9wH2uPM7q4J2x84X5TTNCn6LWWcMUMRhxDFy";
    const BIN_ID = "68fee10aae596e708f2f4ffb";
    const HEADERS = {
      "Content-Type": "application/json",
      "X-Master-Key": JSONBIN_API_KEY
    };

    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const formTitle = document.getElementById("form-title");

    // Toggle forms
    function showRegister() {
      loginForm.classList.add("d-none");
      registerForm.classList.remove("d-none");
      formTitle.textContent = "📝 Register Admin";
    }
    function showLogin() {
      registerForm.classList.add("d-none");
      loginForm.classList.remove("d-none");
      formTitle.textContent = "🔐 Admin Login";
    }

    // Fetch JSONBin data
    async function fetchData() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          method: "GET",
          headers: HEADERS
        });
        const json = await res.json();
        return json.record || {};
      } catch(err) {
        console.error(err);
        return {};
      }
    }

    // Save JSONBin data
    async function saveData(data) {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: HEADERS,
          body: JSON.stringify(data)
        });
        return res.ok;
      } catch(err) {
        console.error(err);
        return false;
      }
    }

    // Login submit
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value.trim();

      const data = await fetchData();
      if(data.Admin && data.Admin.Username === username && data.Admin.Password === password) {
        alert("Login Success!"); 
        // Redirect to index.html or open site
        window.location.href = "/";
      } else {
        const errDiv = document.getElementById("login-error");
        errDiv.textContent = "Invalid credentials";
        errDiv.classList.remove("d-none");
      }
    });

    // Register submit
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("register-username").value.trim();
      const password = document.getElementById("register-password").value.trim();

      const data = await fetchData();
      if(data.Admin) {
        const errDiv = document.getElementById("register-error");
        errDiv.textContent = "Admin already registered!";
        errDiv.classList.remove("d-none");
        return;
      }

      data.Admin = { Username: username, Password: password };
      const success = await saveData(data);
      if(success) {
        alert("Admin registered successfully!");
        showLogin();
      } else {
        const errDiv = document.getElementById("register-error");
        errDiv.textContent = "Failed to save admin!";
        errDiv.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
